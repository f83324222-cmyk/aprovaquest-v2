<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios de Juros Simples</title>

  <link rel="stylesheet" href="../../../../css/style.css">
</head>

<body>

  <main class="container">

    <h1>Exercícios de Juros Simples</h1>

    <p id="status">Página carregada. Testando...</p>

    <div id="questoes-container"></div>

  </main>

  <script type="module">
    console.log("SCRIPT INICIADO");

    const status = document.getElementById("status");
    const container = document.getElementById("questoes-container");

    status.textContent = "JavaScript funcionando!";

    container.innerHTML = `
      <article class="card question">
        <h2>Teste</h2>
        <p>Se você está vendo esta questão, o HTML e o JavaScript estão funcionando.</p>

        <div class="alternatives">
          <button class="alternative">A) Alternativa A</button>
          <button class="alternative">B) Alternativa B</button>
          <button class="alternative">C) Alternativa C</button>
          <button class="alternative">D) Alternativa D</button>
          <button class="alternative">E) Alternativa E</button>
        </div>
      </article>
    `;
  </script>

</body>
</html>
